name: Build and Push Image

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      go_version:
        description: "Go release tag to build, e.g. go1.26.2. Empty = resolve the latest from go-review.googlesource.com."
        required: false
        default: ""
      go_bootstrap_version:
        description: "Bootstrap toolchain version, e.g. go1.25.9. Empty = resolve the latest published toolchain of the previous release."
        required: false
        default: ""

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/playground

concurrency:
  group: docker-build-push
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - name: Resolve Go versions
        id: goversions
        env:
          INPUT_GO_VERSION: ${{ inputs.go_version }}
          INPUT_GO_BOOTSTRAP_VERSION: ${{ inputs.go_bootstrap_version }}
        run: |
          set -euo pipefail
          go_version="$INPUT_GO_VERSION"
          bootstrap_version="$INPUT_GO_BOOTSTRAP_VERSION"
          if [ -z "$go_version" ]; then
            go_version=$(go run ./cmd/latestgo)
          fi
          if [ -z "$bootstrap_version" ]; then
            bootstrap_version=$(go run ./cmd/latestgo -prev -toolchain)
          fi
          echo "Resolved GO_VERSION=$go_version GO_BOOTSTRAP_VERSION=$bootstrap_version"
          echo "go_version=$go_version" >> "$GITHUB_OUTPUT"
          echo "bootstrap_version=$bootstrap_version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=${{ steps.goversions.outputs.go_version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            GO_VERSION=${{ steps.goversions.outputs.go_version }}
            GO_BOOTSTRAP_VERSION=${{ steps.goversions.outputs.bootstrap_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
